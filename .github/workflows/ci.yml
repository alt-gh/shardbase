name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Reject tracked private state and generated artifacts
        run: |
          python -B - <<'PY'
          import os
          import subprocess
          import sys

          forbidden_directories = {
              ".obsidian", "__pycache__", ".venv", "venv", "env", "ENV",
              ".pytest_cache", ".mypy_cache", ".ruff_cache", "htmlcov",
              "build", "dist",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          violations = []
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = os.fsdecode(raw_path)
              parts = path.split("/")
              name = parts[-1]
              if (
                  path.startswith("app/Knowledge/")
                  or any(part in forbidden_directories for part in parts[:-1])
                  or any(part.endswith(".egg-info") for part in parts[:-1])
                  or name.endswith((".pyc", ".pyo", ".sbbackup"))
                  or name == ".coverage"
                  or name.startswith(".coverage.")
              ):
                  violations.append(path)
          if violations:
              print("Repository hygiene failed: prohibited tracked paths:")
              for path in violations:
                  print(f"  {path!r}")
              sys.exit(1)
          print("Repository hygiene passed: no tracked private state or generated artifacts.")
          PY

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check --cache-dir "${{ runner.temp }}/shardbase-ruff-cache" .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/Scripts/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r app/Scripts/requirements.txt

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke test CLI
        run: python -B app/Scripts/shardbase.py commands

  bootstrap-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Bootstrap disposable private instances and verify launcher
        run: python -B tests/bootstrap_smoke.py
